<h2 mat-dialog-title>{{ data.title }}</h2>
    <mat-dialog-content>
      <p *ngIf="data.message">{{ data.message }}</p>

      <h2>Team : {{data[0].team_name}}</h2>
      <h4>Captain : {{data[0].team_captain}}</h4>
      <table mat-table [dataSource]="data[0].player" class="custom-table"  *ngIf="data[0].player?.length">
        <!-- Name Column -->
    
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Player Name</th>
          <td mat-cell *matCellDef="let user">{{ user.player_name }}</td>
        </ng-container>

        <!-- Age Column -->
        <ng-container matColumnDef="skill">
          <th mat-header-cell *matHeaderCellDef>Skill</th>
          <td mat-cell *matCellDef="let user">{{ user.rating }}</td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>Position</th>
          <td mat-cell *matCellDef="let user">{{ user.position }}</td>
        </ng-container>

        <ng-container matColumnDef="sold-price">
            <th mat-header-cell *matHeaderCellDef>Sold-Price</th>
            <td mat-cell *matCellDef="let user">{{ user.soldPrice }} Cr</td>
          </ng-container>

        <tr mat-header-row *matHeaderRowDef="['name', 'skill', 'position','sold-price']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name', 'skill', 'position','sold-price'];"></tr>
      </table>

      <p *ngIf="!data[0].player?.length">No Players Yet..</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button (click)="close()">Close</button>
    </mat-dialog-actions>
